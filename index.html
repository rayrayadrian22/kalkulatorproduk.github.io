<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Two Interior - Professional Planner</title>
    <style>
        :root { 
            --primary: #1a1a1a; --accent: #FF0000; --bg: #f4f7f9; --card: #ffffff; 
            --text: #1a1a1a; --border: #eeeeee; --report-bg: #1a1a1a;
        }

        body.dark-mode { 
            --primary: #000000; --accent: #FF0000; --bg: #121212; --card: #1e1e1e; 
            --text: #f5f5f5; --border: #333333; --report-bg: #000000;
        }

        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; transition: 0.3s; }
        .container { max-width: 1100px; margin: auto; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); margin-bottom: 20px; position: relative; transition: 0.3s; }
        
        /* Responsive Header */
        .header-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; gap: 15px; }
        .logo-text { font-size: 24px; font-weight: 900; color: var(--accent); text-transform: uppercase; line-height: 1; }
        .logo-sub { font-size: 12px; font-weight: 600; color: var(--text); display: block; letter-spacing: 2px; }

        .theme-toggle { cursor: pointer; background: var(--bg); border: 1.5px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; color: var(--text); display: flex; align-items: center; gap: 5px; }

        .grid-header-top { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; align-items: end; }
        .grid-header-group { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 10px; }
        
        @media (min-width: 600px) {
            .grid-header-group { grid-template-columns: 1fr 1fr; }
        }

        label { display: block; font-size: 11px; font-weight: 800; margin-bottom: 8px; color: #7f8c8d; text-transform: uppercase; }
        input, select { padding: 12px; border: 1.5px solid var(--border); border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 14px; background: var(--card); color: var(--text); }
        
        /* Table Responsive */
        .table-responsive { width: 100%; overflow-x: auto; margin-top: 15px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { text-align: left; font-size: 11px; color: #95a5a6; padding: 12px; border-bottom: 2px solid var(--border); }
        td { padding: 10px; border-bottom: 1px solid var(--border); }
        
        .btn { padding: 12px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; transition: 0.3s; text-transform: uppercase; font-size: 11px; }
        .btn-main { background: var(--primary); color: white; width: 100%; }
        @media (min-width: 800px) { .btn-main { width: auto; min-width: 180px; } }

        .btn-add-row { background: #2ecc71; color: white; width: 100%; margin-top: 10px; }
        .btn-accent { background: var(--accent); color: white; width: 100%; margin-top: 25px; font-size: 16px; box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3); }
        .btn-danger { background: #fff1f0; color: #e74c3c; border: 1px solid #ffa39e; padding: 8px 12px; }
        
        .btn-copy { background: #3498db; color: white; margin-top: 15px; width: 100%; }
        @media (min-width: 600px) { .btn-copy { width: auto; align-self: flex-end; } }

        .btn-download { background: #9b59b6; color: white; font-size: 9px; padding: 6px 10px; margin-top: 10px; }
        @media (min-width: 600px) { 
            .btn-download { position: absolute; top: 10px; right: 10px; margin-top: 0; }
        }

        .btn-flip { background: var(--primary); color: white; font-size: 10px; padding: 8px; margin-top: 5px; display: none; border: 1.5px solid var(--border); width: 100%; }

        /* Report & Visual */
        .report-card { background: var(--card); color: var(--text); border-radius: 12px; overflow: hidden; margin-top: 30px; border: 1px solid var(--border); display: flex; flex-direction: column; }
        .report-header { background: var(--report-bg); padding: 15px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--accent); color: white; gap: 10px; }
        .report-body { padding: 15px; display: flex; flex-direction: column; }
        .report-item { background: rgba(0,0,0,0.03); border-radius: 10px; padding: 15px; margin-bottom: 15px; border-left: 4px solid var(--accent); }
        body.dark-mode .report-item { background: rgba(255,255,255,0.05); }
        
        .report-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media (min-width: 600px) { .report-stats { grid-template-columns: repeat(4, 1fr); } }

        .stat-value { font-size: 16px; font-weight: 700; font-family: monospace; }
        .visual-container { margin-top: 10px; overflow-x: auto; background: #dfe6e9; padding: 15px; border-radius: 12px; border: 1px solid #bdc3c7; text-align: center; position: relative; }
        canvas { background: white; max-width: 100%; height: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 1px solid #000; margin-top: 35px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header-top">
            <div class="logo-text">Double Two<span class="logo-sub">INTERIOR</span></div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div id="date-now" style="font-size:10px; color:#95a5a6; font-weight:600;"></div>
                <div class="theme-toggle" onclick="toggleDarkMode()">
                    <span id="theme-icon">🌙</span> <span id="theme-text">Mode</span>
                </div>
            </div>
        </div>
        <div class="grid-header-top">
            <div><label>Nama Customer</label><input type="text" id="customer" placeholder="Nama Pelanggan"></div>
            <div><label>Waste (cm)</label><input type="number" id="waste" value="0"></div>
            <button class="btn btn-main" onclick="addGroup()">+ JENIS PRODUK</button>
        </div>
    </div>

    <div id="groups"></div>
    <button class="btn btn-accent" onclick="prosesKalkulasi()">HITUNG & GENERATE</button>

    <div id="result-area" style="display:none;">
        <div id="rekomendasi-list" style="background:#fffbe6; padding:15px; border-radius:10px; margin-bottom:20px; color:#856404; font-size:13px; display:none;"></div>
        <div class="report-card">
            <div class="report-header">
                <h3 style="margin:0; font-size:14px;">RINGKASAN</h3>
                <span id="res-customer" style="font-size:11px; opacity:0.8"></span>
            </div>
            <div class="report-body">
                <div id="report-content"></div>
                <button class="btn btn-copy" onclick="copyReport()">📋 COPY CHAT</button>
            </div>
        </div>
        <div class="card" style="padding:15px;">
            <h3 style="margin:0 0 10px 0; font-size:14px;">SKEMA POTONG</h3>
            <div id="canvas-list"></div>
        </div>
    </div>
</div>

<script>
function toggleDarkMode() {
    const isDark = document.body.classList.toggle('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    updateThemeUI(isDark);
}
function updateThemeUI(isDark) {
    document.getElementById('theme-icon').innerText = isDark ? '☀️' : '🌙';
}
if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark-mode'); updateThemeUI(true); }
document.getElementById("date-now").innerText = new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'short', day: 'numeric' });

const produkFullData = {
    "Sandblast Polos": [{var: "90 cm", lebar: 90}, {var: "120 cm", lebar: 120}, {var: "90 cm TEBAL", lebar: 90}, {var: "120 cm TEBAL", lebar: 120}, {var: "150 cm SUPER", lebar: 150}],
    "Sandblast Solid Putih": [{var: "-", lebar: 122}],
    "Sandblast Solid Hitam": [{var: "-", lebar: 122}],
    "Sandblast Extra Buram": [{var: "90 cm", lebar: 90}, {var: "122 cm", lebar: 122}],
    "Sandblast Motif": [{var: "Kotak", lebar: 122, strict: false}, {var: "Bambu", lebar: 122, strict: true}, {var: "Garis 1,5 cm", lebar: 122, strict: true}, {var: "Garis 2,5 cm", lebar: 122, strict: true}, {var: "Gelombang", lebar: 122, strict: true}, {var: "Ketupat", lebar: 122, strict: false}, {var: "Paving", lebar: 122, strict: false}, {var: "Mozaic A", lebar: 122, strict: false}, {var: "Mozaic B", lebar: 122, strict: false}, {var: "Mozaic C", lebar: 122, strict: false}, {var: "Trigonal", lebar: 122, strict: false}],
    "Sandblast Motif MORU": [{var: "Clear 15 mm", lebar: 152, strict: true}, {var: "Clear 7 mm", lebar: 152, strict: true}, {var: "Frosted 12 mm", lebar: 152, strict: true}, {var: "Frosted 7 mm", lebar: 152, strict: true}],
    "Kaca Film Riben": [{var: "40%", lebar: 152}, {var: "60%", lebar: 152}, {var: "80%", lebar: 152}],
    "Kaca Film 3M": [{var: "40%", lebar: 152}, {var: "60%", lebar: 152}, {var: "80%", lebar: 152}],
    "Kaca Film One Way": [{var: "80% Silver-Hitam", lebar: 152}, {var: "60% Silver-Hitam", lebar: 152}, {var: "60% Silver-Biru", lebar: 152}, {var: "60% Silver-Hijau", lebar: 152}, {var: "60% Silver-BiruTua", lebar: 152}, {var: "60% Silver-Silver", lebar: 152}],
    "Kaca Film Dichroic": [{var: "Merah", lebar: 138}, {var: "Biru", lebar: 138}]
};

let reportForCopy = "";

function addGroup() {
    const id = "group-" + Date.now();
    const div = document.createElement("div");
    div.className = "card group-card";
    div.id = id;
    const prodOptions = Object.keys(produkFullData).map(p => `<option value="${p}">${p}</option>`).join('');
    div.innerHTML = `
        <div class="grid-header-group">
            <div><label>Produk</label><select class="prod-sel" onchange="updateVarianOptions(this)">${prodOptions}</select></div>
            <div><label>Varian</label><select class="var-sel" onchange="showStrictBadge(this)"></select></div>
        </div>
        <div class="strict-info-container"></div>
        <button class="btn btn-flip" onclick="toggleFlip(this)">🔄 Motif Vertikal (Panjang)</button>
        <div class="table-responsive">
            <table>
                <thead><tr><th>Lebar (cm)</th><th>Tinggi (cm)</th><th>Qty</th><th>Aksi</th></tr></thead>
                <tbody class="table-body"></tbody>
            </table>
        </div>
        <button class="btn btn-add-row" onclick="addRow('${id}')">+ Baris Ukuran</button>
        <button class="btn btn-danger" style="margin-top:10px; width:100%" onclick="document.getElementById('${id}').remove()">Hapus Grup</button>
    `;
    document.getElementById("groups").appendChild(div);
    updateVarianOptions(div.querySelector(".prod-sel"));
}

function updateVarianOptions(sel) {
    const group = sel.closest(".group-card");
    const varSel = group.querySelector(".var-sel");
    const varians = produkFullData[sel.value];
    varSel.innerHTML = varians.map((v, index) => `<option value="${index}" data-lebar="${v.lebar}" data-strict="${v.strict || false}">${v.var} (${v.lebar} cm)</option>`).join('');
    showStrictBadge(varSel);
}

function showStrictBadge(sel) {
    const group = sel.closest(".group-card");
    const opt = sel.options[sel.selectedIndex];
    const container = group.querySelector(".strict-info-container");
    const flipBtn = group.querySelector(".btn-flip");
    const isStrict = opt.getAttribute("data-strict") === "true";
    container.innerHTML = isStrict ? `<span style="font-size:10px; color:#d48806; font-weight:bold;">⚠️ MOTIF STRICT</span>` : "";
    flipBtn.style.display = isStrict ? "block" : "none";
    flipBtn.dataset.flipped = "false";
    flipBtn.innerText = "🔄 Motif Vertikal (Panjang)";
}

function toggleFlip(btn) {
    const isFlipped = btn.dataset.flipped === "true";
    btn.dataset.flipped = !isFlipped;
    btn.innerText = isFlipped ? "🔄 Motif Vertikal (Panjang)" : "✅ Motif Horizontal (Lebar)";
    btn.style.background = isFlipped ? "var(--primary)" : "#27ae60";
}

function addRow(groupId) {
    const tbody = document.querySelector(`#${groupId} .table-body`);
    const row = tbody.insertRow();
    row.innerHTML = `<td><input type="number" class="w-in"></td><td><input type="number" class="h-in"></td><td><input type="number" class="q-in" value="1"></td><td><button class="btn btn-danger" style="padding:5px 10px" onclick="this.closest('tr').remove()">✕</button></td>`;
}

function prosesKalkulasi() {
    const waste = parseFloat(document.getElementById("waste").value) || 0;
    const groups = document.querySelectorAll(".group-card");
    const canvasList = document.getElementById("canvas-list");
    const reportContent = document.getElementById("report-content");
    const rekBox = document.getElementById("rekomendasi-list");
    canvasList.innerHTML = ""; reportContent.innerHTML = ""; rekBox.innerHTML = ""; rekBox.style.display = "none";
    let custName = document.getElementById("customer").value;
    document.getElementById("res-customer").innerText = custName ? custName : "";
    let rekomendasiArr = [];
    reportForCopy = `Hasil Perhitungan Kebutuhan:\n\n`;
    groups.forEach(g => {
        const prodName = g.querySelector(".prod-sel").value;
        const varIndex = g.querySelector(".var-sel").value;
        const varData = produkFullData[prodName][varIndex];
        const flipBtn = g.querySelector(".btn-flip");
        const isFlipped = flipBtn.dataset.flipped === "true";
        const rollW = varData.lebar;
        const rows = g.querySelectorAll(".table-body tr");
        let itemsForNesting = [];
        rows.forEach(r => {
            let wIn = parseFloat(r.querySelector(".w-in").value) || 0;
            let hIn = parseFloat(r.querySelector(".h-in").value) || 0;
            let q = parseInt(r.querySelector(".q-in").value) || 0;
            if(wIn > 0 && hIn > 0) {
                let wF = wIn + (waste * 2); let hF = hIn + (waste * 2);
                if(isFlipped) {
                    if(hF > rollW) { rekomendasiArr.push(`❌ Tinggi ${hIn}cm tidak muat horizontal di roll ${rollW}cm.`); }
                    for(let i=0; i<q; i++) itemsForNesting.push({w: wF, h: hF, label: `${wIn}x${hIn}(H)`});
                } else if(wF > rollW) {
                    let p = Math.ceil(wF/rollW); for(let i=0; i<(q*p); i++) itemsForNesting.push({w: wF/p, h: hF, label: `${wIn}x${hIn}(P)`});
                } else { for(let i=0; i<q; i++) itemsForNesting.push({w: wF, h: hF, label: `${wIn}x${hIn}`}); }
            }
        });
        if(itemsForNesting.length === 0) return;
        let shelves = [];
        if(isFlipped) {
            itemsForNesting.forEach(item => {
                let placed = false;
                for(let s of shelves) {
                    if(s.rem >= item.h) { s.items.push({ x: rollW - s.rem, y: s.y, w: item.h, h: item.w, label: item.label }); s.rem -= item.h; s.mH = Math.max(s.mH, item.w); placed = true; break; }
                }
                if(!placed) { let y = shelves.reduce((acc, s) => acc + s.mH, 0); shelves.push({ y: y, mH: item.w, rem: rollW - item.h, items: [{ x: 0, y: y, w: item.h, h: item.w, label: item.label }] }); }
            });
        } else {
            itemsForNesting.sort((a,b) => b.h - a.h);
            itemsForNesting.forEach(item => {
                let placed = false;
                for(let s of shelves) {
                    if(s.rem >= item.w) { s.items.push({ x: rollW - s.rem, y: s.y, w: item.w, h: item.h, label: item.label }); s.rem -= item.w; s.mH = Math.max(s.mH, item.h); placed = true; break; }
                }
                if(!placed) { let y = shelves.reduce((acc, s) => acc + s.mH, 0); shelves.push({ y: y, mH: item.h, rem: rollW - item.w, items: [{ x: 0, y: y, w: item.w, h: item.h, label: item.label }] }); }
            });
        }
        let totalH = shelves.reduce((acc, s) => acc + s.mH, 0);
        let buyH = Math.ceil(totalH / 50) * 50; if(buyH === 50) buyH = 100;
        let pcs = buyH / 50;
        reportForCopy += `✅ *${prodName} (${varData.var})${isFlipped ? ' [H]' : ''}*\n> Checkout: ${pcs} Pcs\nDapat 1 lembar ${rollW} x ${buyH} cm\n\n`;
        const itemDiv = document.createElement("div"); itemDiv.className = "report-item";
        itemDiv.innerHTML = `<h4>${prodName} - ${varData.var}</h4><div class="report-stats"><div class="stat-box"><span class="stat-label">Net</span><span class="stat-value">${totalH.toFixed(0)} cm</span></div><div class="stat-box"><span class="stat-label">Checkout</span><span class="stat-value" style="color:var(--accent)">${buyH} cm</span></div><div class="stat-box"><span class="stat-label">Total Pcs</span><span class="stat-value" style="color:#2ecc71">${pcs} Pcs</span></div></div>`;
        reportContent.appendChild(itemDiv); drawVisual(`${prodName}-${varData.var}`, rollW, shelves, totalH);
    });
    if(rekomendasiArr.length > 0) { rekBox.style.display = "block"; rekBox.innerHTML = "<strong>💡 INFO:</strong><br>" + [...new Set(rekomendasiArr)].join("<br>"); }
    document.getElementById("result-area").style.display = "block";
}

function copyReport() {
    navigator.clipboard.writeText(reportForCopy.trim()).then(() => {
        const btn = document.querySelector(".btn-copy"); btn.innerText = "✅ TERSALIN!";
        setTimeout(() => { btn.innerText = "📋 COPY CHAT"; }, 2000);
    });
}

function drawVisual(title, rollW, shelves, totalH) {
    const scale = 2.0; const vContainer = document.createElement("div");
    vContainer.className = "visual-container";
    vContainer.innerHTML = `<p style="margin:0; font-size:11px; font-weight:700; text-align:left;">Layout: ${title}</p>`;
    const canvas = document.createElement("canvas"); canvas.width = rollW * scale; canvas.height = (totalH + 10) * scale;
    const ctx = canvas.getContext("2d"); ctx.fillStyle = "white"; ctx.fillRect(0,0,canvas.width, canvas.height);
    shelves.forEach(s => {
        s.items.forEach(item => {
            ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = 1; ctx.strokeRect(item.x * scale, item.y * scale, item.w * scale, item.h * scale);
            ctx.fillStyle = "rgba(255, 0, 0, 0.05)"; ctx.fillRect(item.x * scale, item.y * scale, item.w * scale, item.h * scale);
            ctx.fillStyle = "#1a1a1a"; ctx.font = "bold 9px Arial"; if(item.w * scale > 25) ctx.fillText(item.label, (item.x * scale) + 4, (item.y * scale) + 12);
        });
    });
    const btnDl = document.createElement("button"); btnDl.className = "btn btn-download"; btnDl.innerText = "⬇️ DOWNLOAD";
    btnDl.onclick = () => { const link = document.createElement('a'); link.download = `Skema-${title}.png`; link.href = canvas.toDataURL(); link.click(); };
    vContainer.appendChild(canvas); vContainer.appendChild(btnDl);
    document.getElementById("canvas-list").appendChild(vContainer);
}
addGroup();
</script>
</body>
</html>
